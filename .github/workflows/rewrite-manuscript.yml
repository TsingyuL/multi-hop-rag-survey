name: Build rewritten survey

on:
  pull_request:
    branches:
      - main
    paths:
      - 'paper_rewrite/**'
      - '.github/workflows/rewrite-manuscript.yml'
  workflow_dispatch:

concurrency:
  group: rewrite-manuscript-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Static checks
        run: python paper_rewrite/check_rewrite.py

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper_rewrite
          latexmk_use_xelatex: false
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Upload manuscript PDF
        uses: actions/upload-artifact@v4
        with:
          name: multi-hop-retrieval-reasoning-draft
          path: paper_rewrite/main.pdf
